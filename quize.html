<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .quiz-container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: #2980b9;
    }
    #next-btn {
      display: none;
      background: #27ae60;
    }
    #result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h2 id="question">Question text</h2>
    <div id="answer-buttons"></div>
    <button id="next-btn" class="btn">Next</button>
    <div id="result"></div>
  </div>

  <script>
    const questions = [
      {
        question: "What does HTML stand for?",
        answers: [
          { text: "Hyper Text Markup Language", correct: true },
          { text: "High Tech Machine Language", correct: false },
          { text: "Hyperlinks and Text Markup Level", correct: false },
          { text: "Home Tool Markup Language", correct: false }
        ]
      },
      {
        question: "Which language is used for styling web pages?",
        answers: [
          { text: "HTML", correct: false },
          { text: "CSS", correct: true },
          { text: "Java", correct: false },
          { text: "Python", correct: false }
        ]
      },
      {
        question: "What does CSS stand for?",
        answers: [
          { text: "Creative Style System", correct: false },
          { text: "Cascading Style Sheets", correct: true },
          { text: "Computer Style System", correct: false },
          { text: "Colorful Style Syntax", correct: false }
        ]
      },
      {
        question: "Which language is used for web apps logic?",
        answers: [
          { text: "CSS", correct: false },
          { text: "Python", correct: false },
          { text: "JavaScript", correct: true },
          { text: "SQL", correct: false }
        ]
      }
    ];

    const questionElement = document.getElementById("question");
    const answerButtons = document.getElementById("answer-buttons");
    const nextButton = document.getElementById("next-btn");
    const resultElement = document.getElementById("result");

    let currentQuestionIndex = 0;
    let score = 0;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      nextButton.innerHTML = "Next";
      resultElement.innerHTML = "";
      showQuestion();
    }

    function showQuestion() {
      resetState();
      let currentQuestion = questions[currentQuestionIndex];
      let questionNo = currentQuestionIndex + 1;
      questionElement.innerHTML = questionNo + ". " + currentQuestion.question;

      currentQuestion.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerHTML = answer.text;
        button.classList.add("btn");
        answerButtons.appendChild(button);
        if (answer.correct) {
          button.dataset.correct = answer.correct;
        }
        button.addEventListener("click", selectAnswer);
      });
    }

    function resetState() {
      nextButton.style.display = "none";
      while (answerButtons.firstChild) {
        answerButtons.removeChild(answerButtons.firstChild);
      }
    }

    function selectAnswer(e) {
      const selectedBtn = e.target;
      const isCorrect = selectedBtn.dataset.correct === "true";
      if (isCorrect) {
        score++;
        selectedBtn.style.background = "#2ecc71";
      } else {
        selectedBtn.style.background = "#e74c3c";
      }
      Array.from(answerButtons.children).forEach(button => {
        if (button.dataset.correct === "true") {
          button.style.background = "#2ecc71";
        }
        button.disabled = true;
      });
      nextButton.style.display = "block";
    }

    function showResult() {
      resetState();
      questionElement.innerHTML = "Quiz Completed!";
      resultElement.innerHTML = `🎉 Your Score: ${score} / ${questions.length}`;
      nextButton.innerHTML = "Play Again";
      nextButton.style.display = "block";
    }

    function handleNextButton() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestionIndex < questions.length) {
        handleNextButton();
      } else {
        startQuiz();
      }
    });

    startQuiz();
  </script>
</body>
</html>
