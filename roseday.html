<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff5f9e, #ffc371);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
    }

    .card {
        background: rgba(255, 255, 255, 0.2);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        z-index: 2;
    }

    h1 {
        font-size: 3rem;
        color: #fff;
        margin-bottom: 10px;
        animation: glow 2s infinite alternate;
    }

    p {
        font-size: 1.5rem;
        color: #fff;
        margin-bottom: 30px;
    }

    button {
        padding: 15px 30px;
        font-size: 1.2rem;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background: linear-gradient(45deg, #ff0844, #ffb199);
        color: white;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    /* Floating hearts */
    .heart {
        position: absolute;
        font-size: 24px;
        animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(100vh) scale(0.5);
            opacity: 1;
        }
        100% {
            transform: translateY(-10vh) scale(1.5);
            opacity: 0;
        }
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 10px #fff, 0 0 20px #ff4d6d;
        }
        to {
            text-shadow: 0 0 20px #fff, 0 0 40px #ff1e56;
        }
    }
</style>
</head>
<body>

<div class="card">
    <h1>🌹 Happy Rose Day 🌹</h1>
    <p>Sending you roses, love, and kisses 💋💖</p>
    <button onclick="reply()">Reply 💌</button>
</div>

<script>
    function reply() {
        alert("💖 Thank you! Happy Rose Day to you too 🌹💋");
    }

    // Create floating heart bubbles
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = ["❤️","💖","💘","💋","🌹"][Math.floor(Math.random()*5)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (4 + Math.random() * 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }, 300);
</script>

</body>
</html>
